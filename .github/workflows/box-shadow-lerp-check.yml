name: BoxShadow interpolation tests
on:
  push:
    branches: [checks/box-shadow-lerp-endpoints]
permissions:
  contents: read
jobs:
  painting:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 5ac9eaf59b957cd732df4885e6f4cbb219601b78
          fetch-depth: 2
          persist-credentials: false
      - name: Fetch upstream release tags for Flutter SDK version detection
        run: git fetch --unshallow --filter=tree:0 --tags https://github.com/flutter/flutter.git master
      - run: ./bin/flutter --version
      - name: Verify the new null-endpoint test fails before the change
        working-directory: packages/flutter
        run: |
          file=lib/src/painting/box_shadow.dart
          git show a1260c8441f420b5f9f254cbccb801eb922dcfdc:packages/flutter/$file > "$file"
          trap 'git restore -- "$file"' EXIT
          if ../../bin/flutter test --reporter expanded --plain-name 'BoxShadow.lerp handles a null shadow at either endpoint' test/painting/box_painter_test.dart > "$RUNNER_TEMP/before.log" 2>&1; then
            cat "$RUNNER_TEMP/before.log"
            exit 1
          fi
          cat "$RUNNER_TEMP/before.log"
          grep -Ei 'Expected: .*same instance|Expected: .*same object' "$RUNNER_TEMP/before.log"
      - name: Run painting tests
        working-directory: packages/flutter
        run: ../../bin/flutter test --reporter expanded test/painting/box_painter_test.dart
      - name: Check formatting
        run: ./bin/dart format --output=none --set-exit-if-changed packages/flutter/lib/src/painting/box_shadow.dart packages/flutter/test/painting/box_painter_test.dart
